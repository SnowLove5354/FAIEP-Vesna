<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/common :: head('查询结果')"></head>
<body>
<div th:replace="fragments/common :: frontNav"></div>
<div class="gp-container">
    <div class="gp-card">
        <form action="/search" method="get" style="display:flex;gap:8px;">
            <input name="keyword" th:value="${keyword}" class="layui-input" placeholder="输入垃圾名称" style="width:300px;">
            <select name="categoryId" style="width:150px;height:38px;">
                <option value="">全部分类</option>
                <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"
                        th:selected="${categoryId != null and categoryId == c.id}"></option>
            </select>
            <button class="layui-btn layui-btn-normal" type="submit">查询</button>
        </form>
    </div>
    <div class="gp-card">
        <div class="gp-title">查询结果（<span th:text="${items.size()}"></span> 条）</div>
        <table class="layui-table">
            <thead><tr><th>名称</th><th>类别</th><th>危害等级</th><th>降解周期</th><th>投放建议</th><th>常见误区</th></tr></thead>
            <tbody>
            <tr th:each="it : ${items}">
                <td th:text="${it.name}"></td>
                <td><span th:text="${it.categoryName}" th:style="'color:' + ${it.categoryColor}"></span></td>
                <td th:text="${it.hazardLevel}"></td>
                <td th:text="${it.decompositionTime}"></td>
                <td th:text="${it.recycleInfo}"></td>
                <td th:text="${it.commonMistake}"></td>
            </tr>
            <tr th:if="${items.isEmpty()}"><td colspan="6" style="text-align:center;color:#999;">未找到相关垃圾</td></tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
