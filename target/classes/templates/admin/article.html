<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/common :: head('内容管理')"></head>
<body>
<div th:replace="fragments/common :: adminNav"></div>
<div class="gp-container">
    <div th:replace="fragments/common :: adminCrumb('内容管理')"></div>
    <div class="gp-card">
        <div class="gp-title">发布内容</div>
        <form action="/admin/articles/add" method="post">
            <p><input name="title" class="layui-input" placeholder="标题" required></p>
            <p>
                <select name="type" style="width:160px;height:38px;">
                    <option value="ARTICLE">科普文章</option>
                    <option value="NOTICE">平台公告</option>
                </select>
            </p>
            <p><textarea name="content" class="layui-textarea" placeholder="正文（支持HTML）" required></textarea></p>
            <button class="layui-btn layui-btn-normal" type="submit">发布</button>
        </form>
    </div>
    <div class="gp-card">
        <div class="gp-title">内容列表</div>
        <table class="layui-table">
            <thead><tr><th>ID</th><th>标题</th><th>类型</th><th>浏览量</th><th>时间</th><th>操作</th></tr></thead>
            <tbody>
            <tr th:each="a : ${articles}">
                <td th:text="${a.id}"></td><td th:text="${a.title}"></td>
                <td th:text="${a.type == 'NOTICE' ? '公告' : '文章'}"></td>
                <td th:text="${a.viewCount}"></td>
                <td th:text="${#temporals.format(a.createTime,'yyyy-MM-dd')}"></td>
                <td>
                    <form th:action="'/admin/articles/delete/' + ${a.id}" method="post" style="display:inline;" onsubmit="return confirm('确定删除？')">
                        <button class="layui-btn layui-btn-xs layui-btn-danger">删除</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
