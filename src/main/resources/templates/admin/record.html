<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/common :: head('投放审核')"></head>
<body>
<div th:replace="fragments/common :: adminNav"></div>
<div class="gp-container">
    <div th:replace="fragments/common :: adminCrumb('投放审核')"></div>
    <div class="gp-card">
        <form action="/admin/records" method="get" style="display:flex;gap:8px;">
            <select name="status" style="width:160px;height:38px;">
                <option value="">全部状态</option>
                <option value="0" th:selected="${status != null and status == 0}">待审核</option>
                <option value="1" th:selected="${status != null and status == 1}">已通过</option>
                <option value="2" th:selected="${status != null and status == 2}">已驳回</option>
            </select>
            <button class="layui-btn layui-btn-normal" type="submit">筛选</button>
        </form>
    </div>
    <div class="gp-card">
        <div class="gp-title">投放记录</div>
        <table class="layui-table">
            <thead><tr><th>单号</th><th>用户</th><th>分类</th><th>重量</th><th>积分</th><th>状态</th><th>时间</th><th>操作</th></tr></thead>
            <tbody>
            <tr th:each="r : ${records}">
                <td th:text="${r.recordNo}"></td><td th:text="${r.userName}"></td>
                <td th:text="${r.categoryName}"></td><td th:text="${r.weight}"></td>
                <td th:text="${r.prePoints}"></td>
                <td>
                    <span th:if="${r.status == 0}" style="color:#faad14;">待审核</span>
                    <span th:if="${r.status == 1}" style="color:#52c41a;">已通过</span>
                    <span th:if="${r.status == 2}" style="color:#f5222d;">已驳回</span>
                </td>
                <td th:text="${#temporals.format(r.createTime,'yyyy-MM-dd HH:mm')}"></td>
                <td th:if="${r.status == 0}">
                    <form action="/admin/records/audit" method="post" style="display:inline;" onsubmit="return confirm('确定通过并发放积分？')">
                        <input type="hidden" name="id" th:value="${r.id}"><input type="hidden" name="status" value="1">
                        <button class="layui-btn layui-btn-xs layui-btn-normal">通过</button>
                    </form>
                    <form action="/admin/records/audit" method="post" style="display:inline;" onsubmit="return confirm('确定驳回？')">
                        <input type="hidden" name="id" th:value="${r.id}"><input type="hidden" name="status" value="2">
                        <input type="hidden" name="reason" value="信息不完整">
                        <button class="layui-btn layui-btn-xs layui-btn-danger">驳回</button>
                    </form>
                </td>
                <td th:if="${r.status != 0}">—</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
